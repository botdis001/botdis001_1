<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>กำลังดึงพิกัดสภาพอากาศ...</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 100px; background: #2f3136; color: white; }
    </style>
</head>
<body>
    <h2>📍 กำลังตรวจสอบตำแหน่งของคุณ กรุณากด "อนุญาต" (Allow)...</h2>
    
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');

        if (!userId) {
            document.body.innerHTML = `<h2>❌ ไม่พบข้อมูลผู้ใช้ กรุณากลับไปกดปุ่มใหม่ใน Discord</h2>`;
        } else if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                try {
                    // ส่งพิกัดและ userId ไปยัง Endpoint ใน index.js
                    const response = await fetch(`/weather-location?userId=${userId}&lat=${lat}&lon=${lon}`);
                    const resultText = await response.text();
                    document.body.innerHTML = resultText;
                } catch (err) {
                    document.body.innerHTML = `<h2>❌ เกิดข้อผิดพลาดในการเชื่อมต่อกับเซิร์ฟเวอร์บอท</h2>`;
                }
            }, (error) => {
                document.body.innerHTML = `<h2>❌ กรุณาอนุญาตการเข้าถึงตำแหน่ง (Geolocation) ในเบราว์เซอร์ของคุณเพื่อใช้งาน</h2>`;
            }, { enableHighAccuracy: true });
        } else {
            document.body.innerHTML = `<h2>❌ เบราว์เซอร์ของคุณไม่รองรับการระบุตำแหน่ง</h2>`;
        }
    </script>
</body>
</html>
