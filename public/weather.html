<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กำลังตรวจสอบตำแหน่ง...</title>
    <style>
        body { background-color: #313338; color: white; font-family: sans-serif; text-align: center; padding-top: 100px; }
        .box { background: #2b2d31; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    </style>
</head>
<body>
    <div class="box">
        <h2>📍 กำลังขอเข้าถึงตำแหน่งของคุณ...</h2>
        <p>โปรดกด <b>"Allow / อนุญาต"</b> บนเบราว์เซอร์เพื่อรับสภาพอากาศ</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    // ส่งพิกัดไปยัง Backend ของบอท
                    window.location.href = `/weather-location?userId=${userId}&lat=${lat}&lon=${lon}`;
                },
                (error) => {
                    alert('❌ ไม่สามารถเข้าถึงตำแหน่งได้ กรุณาเปิด GPS หรืออนุญาตการเข้าถึงตำแหน่งในเบราว์เซอร์');
                }
            );
        } else {
            alert('❌ เบราว์เซอร์ของคุณไม่รองรับการระบุตำแหน่ง');
        }
    </script>
</body>
</html>
